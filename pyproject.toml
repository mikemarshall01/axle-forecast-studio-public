[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "axle-forecast-studio"
version = "0.1.0"
description = "Python-owned Monte Carlo fleet model and Streamlit dashboard scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.6",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.64,<2",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.4",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "playwright>=1.50",
    "pytest>=8.3,<9",
    "ruff>=0.11,<0.12",
    "scikit-learn>=1.9.1",
]
research = [
    "arviz>=1.3.0",
    "pymc>=6.3.2",
]

[tool.uv]
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src/axle_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the checkout's own src first, so tests in any worktree never run code from a shared editable install.
pythonpath = ["src", "tests"]
markers = ["slow: long end-to-end checks such as executing notebooks; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
